version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qms_postgres
    environment:
      POSTGRES_USER: qms_user
      POSTGRES_PASSWORD: qms_password
      POSTGRES_DB: qms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms_user -d qms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qms_backend
    environment:
      DATABASE_URL: postgresql://qms_user:qms_password@postgres:5432/qms_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qms_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
